<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 - 주문서</title>
  <!-- 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 페이지 상단: 카페 소개 영역 -->
  <header>
    <div class="logo">☕</div>
    <h1>바이브 카페</h1>
    <p class="subtitle">당신의 하루에 바이브를 더하다</p>
  </header>

  <!-- 탭 네비게이션: 주문하기 / 주문 내역 화면 전환 -->
  <nav class="tabs">
    <button type="button" id="tab-btn-order" class="tab-btn active">주문하기</button>
    <button type="button" id="tab-btn-history" class="tab-btn">주문 내역</button>
  </nav>

  <!-- 주문하기 화면 -->
  <section id="order-panel" class="tab-panel">

  <!-- 주문서 영역 (novalidate: 이름 필수 검사는 JavaScript가 처리) -->
  <form id="order-form" novalidate>

    <!-- 1. 이름 -->
    <div class="form-group">
      <label for="name">이름</label>
      <input type="text" id="name" name="name" required>
    </div>

    <!-- 2. 전화번호 -->
    <div class="form-group">
      <label for="phone">전화번호</label>
      <input type="tel" id="phone" name="phone">
    </div>

    <!-- 3. 음료 선택 -->
    <div class="form-group">
      <label for="drink">음료 선택</label>
      <select id="drink" name="drink">
        <option value="" data-price="0">-- 음료를 선택하세요 --</option>
        <option value="americano" data-price="3500">아메리카노 3,500원</option>
        <option value="latte" data-price="4000">카페라떼 4,000원</option>
        <option value="mocha" data-price="4500">카페모카 4,500원</option>
        <option value="vanilla-latte" data-price="4500">바닐라라떼 4,500원</option>
        <option value="green-tea-latte" data-price="4500">녹차라떼 4,500원</option>
        <option value="asyachu" data-price="4000">아샷추 4,000원</option>
        <option value="matcha-latte" data-price="4500">말차라떼 4,500원</option>
        <option value="ube-latte" data-price="5000">우베라떼 5,000원</option>
      </select>
    </div>

    <!-- 4. 사이즈 -->
    <fieldset class="form-group">
      <legend>사이즈</legend>

      <input type="radio" id="size-s" name="size" value="s" data-price="0">
      <label for="size-s">S (+0원)</label>

      <input type="radio" id="size-m" name="size" value="m" data-price="0" checked>
      <label for="size-m">M (+0원)</label>

      <input type="radio" id="size-l" name="size" value="l" data-price="1000">
      <label for="size-l">L (+1,000원)</label>
    </fieldset>

    <!-- 5. 추가 옵션 -->
    <fieldset class="form-group">
      <legend>추가 옵션</legend>

      <input type="checkbox" id="option-shot" name="options" value="shot" data-price="500">
      <label for="option-shot">샷 추가 (+500원)</label>

      <input type="checkbox" id="option-cream" name="options" value="cream" data-price="500">
      <label for="option-cream">크림 추가 (+500원)</label>

      <input type="checkbox" id="option-syrup" name="options" value="syrup" data-price="300">
      <label for="option-syrup">시럽 추가 (+300원)</label>

      <input type="checkbox" id="option-decaf" name="options" value="decaf" data-price="500">
      <label for="option-decaf">디카페인 (+500원)</label>
    </fieldset>

    <!-- 6. 수량 -->
    <div class="form-group">
      <label for="quantity">수량</label>
      <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
    </div>

    <!-- 7. 요청사항 -->
    <div class="form-group">
      <label for="request">요청사항</label>
      <textarea id="request" name="request"></textarea>
    </div>

    <!-- 8. 예상 금액 표시 영역 -->
    <div id="estimated-price" class="form-group">
      예상 금액: 0원
    </div>

    <!-- 9, 10. 버튼 영역 -->
    <div class="form-group">
      <button type="submit" id="order-btn">주문하기</button>
      <button type="reset" id="reset-btn">다시 작성</button>
    </div>

  </form>

  <!-- 11. 주문 확인 메시지 영역 (처음에는 숨김) -->
  <div id="order-confirmation" hidden>
  </div>

  </section>

  <!-- 주문 내역 화면 (처음에는 숨김) -->
  <section id="history-panel" class="tab-panel hidden">
    <p id="order-history-empty">접수된 주문이 없습니다</p>
    <div id="order-history-list"></div>
  </section>

  <!-- Supabase 클라이언트 라이브러리 (CDN) - script.js보다 먼저 불러와야 window.supabase를 사용할 수 있음 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 스크립트 연결 -->
  <script src="script.js"></script>
</body>
</html>
